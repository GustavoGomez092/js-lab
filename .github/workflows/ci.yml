name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Hutch 0.24.3
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh -o "$RUNNER_TEMP/hutch-install.sh"
          sh "$RUNNER_TEMP/hutch-install.sh" --version 0.24.3
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - run: hutch --version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  e2e-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      JSLAB_E2E_SKIP_SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Hutch 0.24.3
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh -o "$RUNNER_TEMP/hutch-install.sh"
          sh "$RUNNER_TEMP/hutch-install.sh" --version 0.24.3
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: hutch run build:dev
        working-directory: apps/desktop
      - run: bun run e2e
